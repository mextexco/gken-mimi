<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>G検定 耳学習</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="m-sp">
<header class="appbar">
  <button type="button" class="brand" data-go="home">G検定 耳学習</button>
  <span class="countdown" id="barCount"></span>
  <button type="button" class="modebtn" id="modeBtn" aria-label="表示モードを切り替え">表示: 自動</button>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="画面の切り替え">
    <button type="button" data-go="home"><span class="ic">◎</span>ホーム</button>
    <button type="button" data-go="listen"><span class="ic">♪</span>聞く</button>
    <button type="button" data-go="quiz"><span class="ic">?</span>テスト</button>
    <button type="button" data-go="learn"><span class="ic">≡</span>学ぶ</button>
    <button type="button" data-go="settings"><span class="ic">⚙</span>設定</button>
  </nav>

  <main id="main">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-listen"></section>
    <section class="view" id="v-quiz"></section>
    <section class="view" id="v-learn"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>

<div class="mini" id="mini" hidden>
  <div class="mini-bar"><i id="miniFill"></i></div>
  <div class="mini-in">
    <button type="button" class="mini-t" id="miniTitle" data-go="listen"></button>
    <button type="button" class="ib" id="miniBack" aria-label="5秒戻す">-5</button>
    <button type="button" class="ib play" id="miniPlay" aria-label="再生">▶</button>
    <button type="button" class="ib" id="miniFwd" aria-label="5秒進む">+5</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="au" preload="metadata"></audio>
<input type="file" id="filePick" accept="audio/*" hidden>
<input type="file" id="backupPick" accept="application/json,.json" hidden>

<script src="js/data.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
